spring:
  application:
    name: deeptodo

  datasource:
    # Default'lar compose.yaml'daki local PostgreSQL'e karsilik gelir (host portu 5433); prod'da env variable ile ezilir.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/deeptodo}
    username: ${DB_USERNAME:deeptodo}
    password: ${DB_PASSWORD:deeptodo}

  jpa:
    # Schema'nin sahibi Flyway; Hibernate yalniz entity <-> tablo uyumunu kontrol eder.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mvc:
    # Validation (400), 405 gibi Spring MVC hataları da ProblemDetail formatında dönsün.
    problemdetails:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Token'ları Keycloak üretir; uygulama yalnız doğrular.
          # issuer-uri: ilk token geldiğinde <issuer>/.well-known/openid-configuration okunur, JWKS adresi oradan bulunur
          # (bu yüzden Keycloak kapalıyken de uygulama açılır). Token'daki "iss" bu değerle birebir aynı olmalı.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/deeptodo}
          # Token'ın "aud" claim'i bu değeri içermeli: aynı realm'in başka bir uygulama için ürettiği token burada geçmez.
          # Keycloak'ta deeptodo-web / deeptodo-dev client'larındaki audience mapper bu değeri token'a yazar.
          audiences: ${KEYCLOAK_AUDIENCE:deeptodo-api}
