spring:
  application:
    name: deeptodo

  datasource:
    # Default'lar compose.yaml'daki local PostgreSQL'e karsilik gelir (host portu 5433); prod'da env variable ile ezilir.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/deeptodo}
    username: ${DB_USERNAME:deeptodo}
    password: ${DB_PASSWORD:deeptodo}

  jpa:
    # Schema'nin sahibi Flyway; Hibernate yalniz entity <-> tablo uyumunu kontrol eder.
    hibernate:
      ddl-auto: validate
    open-in-view: false

deeptodo:
  security:
    jwt:
      issuer: https://api.deeptodo.local
      access-token-ttl: 15m
      key-id: deeptodo-2026-10
      private-key-location: file:./secrets/jwt-private.pem
      public-key-location: file:./secrets/jwt-public.pem
    refresh-token:
      ttl: 14d
      cookie-name: refresh_token
      # Local HTTP'de false; production (HTTPS) ortamında true verilmeli.
      cookie-secure: ${REFRESH_COOKIE_SECURE:false}
