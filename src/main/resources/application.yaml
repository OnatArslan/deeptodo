spring:
  application:
    name: deeptodo

management:
  endpoints:
    web:
      exposure:
        # Varsayılan da bu; açıkça yazıldı: production'da HTTP'ye yalnız health açık. Diğer endpoint'ler (beans, env,
        # conditions...) uygulamanın içini gösterir, saldırgana harita olur. Local'de application-local.yaml genişletir.
        include: health
