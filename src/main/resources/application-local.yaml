# Yalnız "local" profili aktifken okunur (./mvnw spring-boot:run bu profili açar, pom.xml).
# Aynı key application.yaml'da da var; profil dosyası sonra yüklendiği için onu ezer.
management:
  endpoints:
    web:
      exposure:
        # Spring'in içini gözlemlemek için: hangi bean'ler var, hangi auto-configuration neden çalıştı / çalışmadı,
        # property'ler nereden geldi, hangi URL hangi metoda gidiyor.
        include: health, beans, conditions, configprops, env, mappings
  endpoint:
    health:
      show-details: always
