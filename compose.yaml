services:
  postgres:
    image: postgres:17.6
    container_name: deeptodo-postgres
    environment:
      POSTGRES_DB: deeptodo
      POSTGRES_USER: deeptodo
      POSTGRES_PASSWORD: deeptodo
    ports:
      # Host 5432 bu makinede başka bir projenin Postgres'inde; çakışmasın diye 5433.
      # 127.0.0.1: DB yalnız bu makineden erişilebilir, ağdaki başka cihazlara açılmaz.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Volume ilk kez oluşturulurken (boş data dizini) çalışır: Keycloak'ın database'ini ve kullanıcısını açar.
      # Mevcut bir volume'de çalışmaz; o durumda README / STATUS'taki tek seferlik komut.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptodo -d deeptodo"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: deeptodo-keycloak
    # start-dev: HTTP'ye izin verir, cache'leri kapatır, tema değişikliklerini anında gösterir. Production'da "start" (F2).
    # --import-realm: /opt/keycloak/data/import altındaki realm dosyalarını açılışta yükler; realm zaten varsa atlar.
    command: ["start-dev", "--import-realm"]
    environment:
      # Keycloak'ın kendi tabloları (realm, user, session, client...) aynı PostgreSQL sunucusunda ayrı bir database'de.
      # Uygulama bu database'e hiç bağlanmaz; iki sistemin verisi birbirine karışmaz.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # master realm'deki ilk yönetici (admin console girişi). Yalnız local; production'da env/secret'tan (E4).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # /health/ready ve /health/live endpoint'leri yönetim portunda (9000) açılır.
      KC_HEALTH_ENABLED: "true"
    ports:
      # Container içinde 8080; host'ta 8180 (8080 Spring Boot'un). Issuer adresi bu porttan türetilir:
      # http://localhost:8180/realms/deeptodo
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Image'da curl yok; bash'in /dev/tcp özelliğiyle yönetim portuna ham HTTP isteği atılır.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
