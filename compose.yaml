services:
  postgres:
    image: postgres:17.6
    container_name: deeptodo-postgres
    environment:
      POSTGRES_DB: deeptodo
      POSTGRES_USER: deeptodo
      POSTGRES_PASSWORD: deeptodo
    ports:
      # Host 5432 bu makinede başka bir projenin Postgres'inde; çakışmasın diye 5433.
      # 127.0.0.1: DB yalnız bu makineden erişilebilir, ağdaki başka cihazlara açılmaz.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptodo -d deeptodo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
