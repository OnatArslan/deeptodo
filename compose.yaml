services:
  postgres:
    image: postgres:17.6
    container_name: deeptodo-postgres
    environment:
      POSTGRES_DB: deeptodo
      POSTGRES_USER: deeptodo
      POSTGRES_PASSWORD: deeptodo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptodo -d deeptodo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
